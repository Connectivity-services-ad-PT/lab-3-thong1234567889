name: Newman Contract Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Install Prism Mock Server globally
      run: npm install -g @stoplight/prism-cli

    - name: Start Access Gate Mock Server
      run: npm run mock:iot &
      # Dấu & giúp chạy ngầm Mock Server trên cổng 4010

    - name: Start AI Vision Mock Server
      run: npm run mock:vision &
      # Dấu & giúp chạy ngầm Mock Server trên cổng 4011

    - name: Wait for Mock Servers to be ready
      run: |
        sleep 5
        curl --silent --fail http://localhost:4010/health || exit 1

    - name: Run Contract Tests
      run: npm run test:mock

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: newman-reports
        path: reports/